[project]
name = "admanager"
version = "0.2.0"
description = "AI-powered ad text editing service with RAG and license management"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "aiofiles>=23.2.1",
    "aiogram>=3.10.0",
    "alembic>=1.18.3",
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "langchain-community>=0.3.21",
    "mypy>=1.19.1",
    "numpy<2.0",
    "openai>=1.40.0",
    "pre-commit>=4.5.1",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pytest>=9.0.2",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.12.1",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.30",
    "types-aiofiles>=25.1.0.20251011",
    "uvicorn>=0.30.0",
    "aiosqlite>=0.19.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
    "types-aiofiles>=25.1.0.20251011",
]

[[tool.mypy.overrides]]
module = "aiofiles.*"
ignore_missing_imports = true

# Игнорируем ошибки типов в bot.py (aiogram v3 имеет сложные union типы)
[[tool.mypy.overrides]]
module = "src.bot.*"
disable_error_code = ["union-attr", "arg-type"]

# Игнорируем ошибки типов в alembic (проблемы с заглушками типов)
[[tool.mypy.overrides]]
module = "alembic.*"
disable_error_code = ["attr-defined", "index"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Маркеры для тестов
markers = [
    "load: mark test as load test (requires --load flag)",
    "stress: mark test as stress test",
    "soak: mark test as soak test",
    "spike: mark test as spike test",
    "chaos: mark test as chaos test",
    "slow: mark test as slow running",
]
