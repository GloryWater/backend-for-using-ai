# CD Pipeline - Build, Push to GHCR, Deploy via SSH
name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "latest"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================
  # Build & Push Docker Image
  # ===========================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=${{ github.run_number }},enable=true

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ===========================================
  # Deploy to Server via SSH
  # ===========================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            echo "🚀 Starting MANUAL deployment to ${{ inputs.environment }}..."
            echo "📦 Branch: ${{ inputs.branch }}"
            echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

            # Navigate to project directory
            cd /root/admanager || {
              echo "❌ Project directory not found!"
              exit 1
            }

            # Login to GHCR to pull private images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest changes from git
            git pull origin ${{ inputs.branch }}

            # Pull new Docker images
            docker compose pull

            # Run database migrations (CRITICAL: before restart!)
            echo "🔧 Running database migrations..."
            docker compose run --rm backend alembic upgrade head

            # Restart services without downtime
            echo "🔄 Restarting services..."
            docker compose up -d --remove-orphans

            # Clean up old Docker images
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            # Logout from GHCR
            docker logout ghcr.io

            # Check container status
            echo "📊 Container status:"
            docker compose ps

            # Show last 20 log lines
            echo "📋 Last 20 log lines:"
            docker compose logs --tail=20

            echo "✅ Deployment completed successfully!"

      - name: Deployment completed
        run: echo "Deployment to server completed successfully!"
