# CD пайплайн для AdManager
# Запускается только при успешном CI при push в main
# Отвечает за сборку, публикацию и деплой

name: CD (Build & Deploy)

on:
  workflow_run:
    workflows: ["CI/CD"]
    types:
      - completed
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Сборка Docker образа ─────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ github.run_number }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Деплой на сервер ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: production
      url: ${{ secrets.SERVER_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            echo "🚀 Starting deployment..."

            # Переход в директорию проекта
            cd /opt/admanager || {
              echo "❌ Project directory not found!"
              exit 1
            }

            # Авторизация Docker в GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Обновление конфигурации
            echo "📥 Pulling latest changes..."
            git pull origin main

            # Скачивание новых образов
            echo "📥 Pulling Docker images..."
            docker-compose pull

            # Применение миграций БД (ОБЯЗАТЕЛЬНО перед перезапуском!)
            echo "🔧 Running database migrations..."
            docker-compose run --rm api alembic upgrade head

            # Перезапуск сервисов
            echo "🔄 Restarting services..."
            docker-compose up -d --remove-orphans

            # Очистка старых образов
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            # Проверка статуса контейнеров
            echo "📊 Container status:"
            docker-compose ps

            # Вывод логов для проверки
            echo "📋 Last 20 log lines:"
            docker-compose logs --tail=20

            echo "✅ Deployment completed successfully!"
