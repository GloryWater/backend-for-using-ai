name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    test:
        runs-on: ubuntu-latest

        # Поднимаем базу данных для интеграционных тестов
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: password
                    POSTGRES_DB: admanager_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true # Магия 2026 года: автоматический кеш

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version-file: ".python-version" # Укажи версию в этом файле или просто "3.12"

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run Ruff (Linter)
              run: uvx ruff check .

            - name: Run Tests
              env:
                  # Передаем URL тестовой базы данных
                  DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/admanager_test
                  DB_USER: postgres
                  DB_PASS: password
                  DB_NAME: admanager_test
                  DB_HOST: localhost
                  DB_PORT: 5432

                  # --- Фейковые ключи (чтобы Pydantic не падал) ---
                  BOT_TOKEN: "fake_bot_token"
                  LLM_API_KEY: "fake_llm_key"
                  LLM_BASE_URL: "https://fake.url/v1"
                  LLM_MODEL: "gpt-fake"
                  TRIBUTE_API_KEY: "fake_tribute_key"
                  CRYPTOCLOUD_API_KEY: "fake_crypto_key"
                  CRYPTOCLOUD_SHOP_ID: "fake_shop_id"
                  CRYPTOCLOUD_SECRET: "fake_secret"

                  # --- Настройки Qdrant ---
                  QDRANT_URL: "http://localhost:6333"
                  QDRANT_COLLECTION: "test_collection"

              run: uv run pytest
