name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    test:
        runs-on: ubuntu-latest

        # Поднимаем базу данных для интеграционных тестов
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: password
                    POSTGRES_DB: admanager_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true # Магия 2026 года: автоматический кеш

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version-file: ".python-version" # Укажи версию в этом файле или просто "3.12"

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run Ruff (Linter)
              run: uvx run ruff check .

            - name: Run Tests
              env:
                  # Передаем URL тестовой базы данных
                  DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/admanager_test
                  BOT_TOKEN: "fake_token" # Для тестов используем заглушки
              run: uv run pytest
