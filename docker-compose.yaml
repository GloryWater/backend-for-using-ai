services:
  # ---------------------------------------------------
  # База данных (PostgreSQL)
  # ---------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: admanager_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # Векторная БД (Qdrant)
  # ---------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: admanager_qdrant
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ---------------------------------------------------
  # API Backend (FastAPI)
  # ---------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admanager_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - .env
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    volumes:
      - .:/app
      - /app/__pycache__

  # ---------------------------------------------------
  # Telegram Bot (Aiogram)
  # ---------------------------------------------------
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admanager_bot
    restart: always
    depends_on:
      - backend
      - db
    env_file:
      - .env
    command: ["python", "-m", "src.bot.bot"]

volumes:
  postgres_data:
  qdrant_data:
