# Pre-commit configuration for AdManager
# See https://pre-commit.com for more information
# Install: uv run pre-commit install

repos:
  # ─── Базовые проверки Git ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        description: Удаление конечных пробелов
      - id: end-of-file-fixer
        description: Добавление конечной новой строки
      - id: check-yaml
        description: Проверка YAML синтаксиса
        args: [--unsafe]
      - id: check-added-large-files
        description: Блокировка больших файлов
        args: [--maxkb=5000]
      - id: check-merge-conflict
        description: Проверка конфликтов слияния
      - id: detect-private-key
        description: Обнаружение приватных ключей
      - id: check-case-conflict
        description: Проверка конфликтов регистров файлов

  # ─── Защита секретов ──────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            .env.*|
            .*\.lock|
            .*\.json$|
            .*\.md$|
            tests/.*|
            alembic/.*
          )$

  # ─── Ruff (линтер и форматтер) ────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        name: Ruff linting
        description: Проверка и автоисправление импортов и ошибок
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Ruff formatting
        description: Форматирование кода

  # ─── MyPy (статическая типизация) ─────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        name: MyPy type checking
        description: Проверка статической типизации
        additional_dependencies:
          - pydantic>=2.8.0
          - pydantic-settings>=2.4.0
          - sqlalchemy>=2.0.30
          - fastapi>=0.110.0
          - aiogram>=3.10.0
          - asyncpg>=0.29.0
          - qdrant-client>=1.12.1
          - sentence-transformers>=3.0.0
          - openai>=1.40.0
        exclude: ^alembic/
        args:
          - --ignore-missing-imports
          - --no-strict-optional
          - --disable-error-code=union-attr
          - --disable-error-code=arg-type
