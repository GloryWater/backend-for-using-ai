version: '3.8'

services:
  # База данных для тестов
  db_test:
    image: postgres:15-alpine
    container_name: admanager_test_db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant для тестов
  qdrant_test:
    image: qdrant/qdrant:latest
    container_name: admanager_test_qdrant
    ports:
      - "6334:6333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Тестовый контейнер
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: admanager_tests
    depends_on:
      db_test:
        condition: service_healthy
      qdrant_test:
        condition: service_healthy
    environment:
      DB_USER: test
      DB_PASS: test
      DB_NAME: test
      DB_HOST: db_test
      DB_PORT: 5432
      BOT_TOKEN: fake_bot_token
      LLM_API_KEY: fake_llm_key
      LLM_BASE_URL: https://fake.url/v1
      LLM_MODEL: gpt-fake
      TRIBUTE_API_KEY: fake_tribute_key
      CRYPTOCLOUD_API_KEY: fake_crypto_key
      QDRANT_URL: http://qdrant_test:6333
    command: >
      sh -c "
      uv run pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=html
      "
    volumes:
      - ./htmlcov:/app/htmlcov
      - ./test-results:/app/test-results
